<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Celica head unit — home mockup</title>
<meta name="viewport" content="width=1024">
<!--
  A 1024×600 mockup of the head-unit home screen. Not the app — a picture of
  the app, drawn with the site's own wireframe viewer so the centrepiece is
  the real car. Everything else is placeholder data.

  Home is deliberately sparse: the car, three live numbers, what's playing,
  the weather. Issues, fusebox, log and manual live behind the dock — the
  home screen is a dash, not a to-do list.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0D0F; --s1:#131216; --line:#26242B; --line2:#36333B;
  --red:#D8433C; --red-dim:#8E3C38; --glow:rgba(216,67,60,.22);
  --tx:#F1EDEA; --tx-dim:#8F8884; --tx-faint:#55504D; --chrome:#C7CACF;
  --disp:"Archivo",sans-serif; --mono:"IBM Plex Mono",monospace; --wm:"Michroma",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--tx);font-family:var(--disp)}
body{display:grid;place-items:center;align-content:center;gap:14px;min-height:100vh}
.sim{display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--tx-dim)}
.sim input{width:320px;accent-color:var(--red)}
.sim span{color:var(--tx);min-width:60px}

/* ---- the screen -------------------------------------------------------- */
.screen{width:1024px;height:600px;background:var(--bg);position:relative;overflow:hidden;
  display:grid;grid-template-rows:48px 1fr 48px}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;
  background:radial-gradient(120% 90% at 50% 40%,transparent 62%,rgba(0,0,0,.5) 100%)}

/* ---- status strip ------------------------------------------------------ */
.strip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--tx-dim);letter-spacing:.08em;text-transform:uppercase}
.strip .wm{font-family:var(--wm);font-size:13px;color:var(--tx);letter-spacing:.2em}
.strip .wm b{color:var(--red)}
.strip .wm .kana{font-family:var(--mono);color:var(--tx-faint);letter-spacing:.3em;margin-left:10px;font-size:11px}
.strip .clock{font-family:var(--disp);font-weight:800;font-size:24px;color:var(--tx);letter-spacing:.01em;text-align:center}
.strip .clock small{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--tx-dim);margin-left:10px;letter-spacing:.08em}
.strip .stat{display:flex;gap:16px;justify-content:flex-end}
.strip .stat span{display:flex;align-items:center;gap:7px}
.strip .stat i{width:6px;height:6px;border-radius:50%;background:var(--tx-faint)}
.strip .stat i.on{background:var(--red);box-shadow:0 0 8px var(--red)}

/* ---- main -------------------------------------------------------------- */
.main{display:grid;grid-template-columns:1fr 330px;gap:14px;padding:14px 20px}
.tile{position:relative;background:var(--s1);border:1px solid var(--line);min-height:0;overflow:hidden}
.tile::before,.tile::after{content:"";position:absolute;width:10px;height:10px;pointer-events:none;z-index:3}
.tile::before{top:-1px;left:-1px;border-top:2px solid var(--chrome);border-left:2px solid var(--chrome)}
.tile::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--chrome);border-right:2px solid var(--chrome)}
.lbl{position:absolute;top:10px;left:14px;z-index:2;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tx-dim)}
.lbl b{color:var(--red);font-weight:600;margin-right:8px}

/* ---- the car ----------------------------------------------------------- */
.veh{display:grid;grid-template-rows:1fr 86px}
.model-wrap{position:relative;min-height:0}
.model-3d{position:absolute;inset:0;opacity:0;transition:opacity .9s}
.model-wrap.live .model-3d{opacity:1}
.model-3d canvas{display:block;width:100%;height:100%}
.model-fb{display:none}
.model-wrap.fallback .model-fb{display:grid;place-items:center;height:100%;color:var(--tx-faint);font-family:var(--mono);font-size:11px}
.veh .floor{position:absolute;left:8%;right:8%;bottom:6%;height:1px;background:linear-gradient(90deg,transparent,var(--line2) 20%,var(--line2) 80%,transparent)}
.veh .grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;opacity:.28;
  mask-image:radial-gradient(60% 60% at 50% 60%,#000 20%,transparent 100%);
  -webkit-mask-image:radial-gradient(60% 60% at 50% 60%,#000 20%,transparent 100%)}
.veh .spec{position:absolute;right:14px;top:10px;z-index:2;text-align:right;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx-faint);line-height:1.8}

/* three numbers, no boxes — one hairline above */
.read{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);position:relative}
.read div{padding:12px 18px 0;border-right:1px solid var(--line)}
.read div:last-child{border-right:0}
.read small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--tx-dim);text-transform:uppercase}
.read b{display:block;font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums}
.read b em{font-style:normal;font-family:var(--mono);font-weight:500;font-size:11px;color:var(--tx-dim);letter-spacing:.12em;margin-left:6px}
.read b.warm{color:var(--chrome)}
/* the lift bar: a single line under the RPM figure, red in the lift zone */
.read .lift{position:absolute;left:33.33%;right:33.33%;bottom:0;height:3px;margin:0 18px;padding:0;border:0;
  background:linear-gradient(90deg,var(--line2) 0 73%,var(--red-dim) 73% 100%)}
.read .lift i{position:absolute;left:0;top:0;bottom:0;width:11%;background:var(--tx)}

/* ---- right column ------------------------------------------------------ */
.side{display:grid;grid-template-rows:1fr 150px;gap:14px;min-height:0}

.np{display:grid;grid-template-rows:auto 1fr auto;padding:0}
.np .art{margin:40px 18px 0;width:190px;height:190px;justify-self:center;
  background:repeating-linear-gradient(135deg,#1a191e 0 10px,#121116 10px 20px);border:1px solid var(--line2);position:relative}
.np .art::after{content:"";position:absolute;inset:16px;border:1px solid var(--red-dim);
  background:radial-gradient(circle at 50% 50%,var(--red) 0 9px,transparent 10px)}
.np .info{padding:14px 18px 0;min-width:0}
.np .title{font-size:20px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .artist{font-size:12px;color:var(--tx-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .bar{margin:14px 0 0;height:2px;background:var(--line2);position:relative}
.np .bar i{position:absolute;left:0;top:0;bottom:0;width:38%;background:var(--red);box-shadow:0 0 8px var(--red)}
.np .ctl{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);margin-top:14px}
.np .ctl button{height:44px;background:transparent;border:0;border-right:1px solid var(--line);color:var(--tx);
  font-family:var(--mono);font-size:13px;letter-spacing:.1em;cursor:pointer}
.np .ctl button:last-child{border-right:0}
.np .ctl button.pl{color:var(--red);font-size:15px}

.wx{display:grid;grid-template-columns:1fr auto;align-items:end;padding:0 18px 14px}
.wx .tmp{font-size:52px;font-weight:900;line-height:1;letter-spacing:-.04em}
.wx .tmp sup{font-size:16px;font-weight:600;color:var(--tx-dim);vertical-align:top;margin-left:2px}
.wx .desc{font-family:var(--mono);font-size:10px;color:var(--tx-dim);letter-spacing:.1em;text-transform:uppercase;line-height:1.8;margin-top:6px}
.wx .desc b{color:var(--tx);font-weight:600}
.wx svg{width:46px;height:46px;stroke:var(--chrome);fill:none;stroke-width:1.3;margin-bottom:4px}

/* ---- dock -------------------------------------------------------------- */
.dock{display:flex;border-top:1px solid var(--line);background:var(--s1);position:relative}
.dock a{flex:1;display:grid;place-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--tx-dim);text-decoration:none;border-right:1px solid var(--line);position:relative}
.dock a:last-child{border-right:0}
.dock a.on{color:var(--tx)}
.dock a.on::after{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--red);box-shadow:0 0 10px var(--red)}
.dock .hz{position:absolute;left:0;right:0;bottom:0;height:3px;
  background:repeating-linear-gradient(-45deg,var(--red) 0 10px,transparent 10px 20px);opacity:.45}
</style>
</head>
<body>
<div class="screen">

  <div class="strip">
    <span class="wm">CELICA <b>T</b>-SPORT<span class="kana">セリカ</span></span>
    <span class="clock" id="clock">12:37<small id="date">TUE 28 OCT</small></span>
    <span class="stat">
      <span><i class="on"></i>OBD</span>
      <span><i class="on"></i>GPS</span>
      <span><i class="on"></i>BT</span>
      <span>12.2V</span>
    </span>
  </div>

  <div class="main">

    <div class="tile veh">
      <span class="lbl"><b>ZZT231</b>2ZZ-GE · VVTL-i</span>
      <div class="spec">190 PS · 8,200 RPM<br>C60 · 6-SPEED</div>
      <div class="model-wrap">
        <div class="grid"></div>
        <div class="floor"></div>
        <div id="model3d" class="model-3d"></div>
        <div class="model-fb">No WebGL</div>
      </div>
      <div class="read">
        <div><small>Speed</small><b id="spd">0<em>MPH</em></b></div>
        <div><small>Engine</small><b id="rpm">912<em>RPM</em></b></div>
        <div><small>Coolant</small><b class="warm">84<em>°C</em></b></div>
        <div class="lift"><i id="liftfill"></i></div>
      </div>
    </div>

    <div class="side">
      <div class="tile np">
        <span class="lbl"><b>●</b>Spotify</span>
        <div class="art"></div>
        <div class="info">
          <div class="title">Deja Vu</div>
          <div class="artist">Dave Rodgers · Night Drive</div>
          <div class="bar"><i></i></div>
        </div>
        <div class="ctl"><button>◀◀</button><button class="pl">▶</button><button>▶▶</button></div>
      </div>

      <div class="tile wx">
        <div>
          <div class="tmp">9<sup>°C</sup></div>
          <div class="desc"><b>Light rain</b> · wind 14 mph<br>2 °C by 06:00 — ice likely</div>
        </div>
        <svg viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1 .5-8 5 5 0 0 1 9.6 1.5A3.3 3.3 0 0 1 17 15H7z"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/></svg>
      </div>
    </div>
  </div>

  <div class="dock">
    <a class="on" href="#">Home</a><a href="#">Drive</a><a href="#">Map</a><a href="#">Media</a><a href="#">Garage</a><a href="#">Manual</a>
    <div class="hz"></div>
  </div>
</div>
<div class="sim"><label for="sim">SIMULATE</label><input id="sim" type="range" min="0" max="120" value="0"><span id="simv">0 mph</span></div>

<script>
  window.CELICA = window.CELICA || {};
  /* mockup control: drive the speed readout, lift bar and wheels together */
  (function () {
    var sl = document.getElementById('sim'), out = document.getElementById('simv');
    var spd = document.getElementById('spd'), rpm = document.getElementById('rpm'), fill = document.getElementById('liftfill');
    function apply() {
      var v = +sl.value; out.textContent = v + ' mph';
      spd.firstChild.nodeValue = v;
      var r = v ? Math.round(1200 + v * 95) : 912;         /* fake: 3rd gear-ish */
      rpm.firstChild.nodeValue = r.toLocaleString();
      fill.style.width = Math.min(100, r / 8200 * 100) + '%';
      fill.style.background = r >= 6000 ? 'var(--red)' : 'var(--tx)';
      if (window.MOCK && MOCK.setSpeed) MOCK.setSpeed(v);
    }
    sl.addEventListener('input', apply);
    window.addEventListener('load', apply);
  })();
  (function tick() {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    document.getElementById('clock').firstChild.nodeValue = p(d.getHours()) + ':' + p(d.getMinutes());
    document.getElementById('date').textContent = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
    setTimeout(tick, 15000);
  })();
</script>
<script>
  /* mockup only: never let the browser cache the model or the viewer — the
     static server sends no cache headers and a stale viewer against a fresh
     model draws nonsense */
  (function () {
    var t = Date.now();
    ['../../docs/assets/js/vendor/three.min.js', '../../docs/data/model.js?t=' + t, 'mockup-model.js?t=' + t]
      .forEach(function (src) { document.write('<script src="' + src + '" defer><\/script>'); });
  })();
</script>
</body>
</html>
